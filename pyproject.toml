[project]
name = "genomics-os-target-builder"
version = "0.1.0"
description = "Reproducible target BED generation module for Genomics-OS"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
target-builder = "target_builder.cli:main"

[build-system]
requires = ["uv_build>=0.9.5,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "target_builder"
module-root = "src"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
